# PostgreSQL only, for local API/web development outside Docker
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
    ports:
      - '5432:5432'
    volumes:
      # Separate volume so it does not collide with the full compose stack
      - pulse_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pulse} -d ${POSTGRES_DB:-pulse}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pulse_pg_dev:
