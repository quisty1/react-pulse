# SPA: все неизвестные пути отдают index.html (client-side routing)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Хешированные ассеты Vite можно кэшировать надолго
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
